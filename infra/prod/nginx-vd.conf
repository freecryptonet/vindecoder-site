# /etc/nginx/sites-enabled/vd
# Snapshot of the prod nginx vhost on the VPS (72.62.154.119).
# Updates: scp this file to the box, `nginx -t && systemctl reload nginx`.
# Backups land in /root/nginx-backups/ (per AGENTS.md).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        if ($bad_bot) { return 429; }
        if ($bad_ip)  { return 429; }
        limit_req zone=site_per_ip burst=50 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# Apex (canonical host) — serves the app
server {
    server_name vindecoder.site;

    location ~ ^/complaints/.+ {
        return 410;
    }
    location / {
        if ($bad_bot) { return 429; }
        if ($bad_ip)  { return 429; }
        limit_req zone=site_per_ip burst=50 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vindecoder.site/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vindecoder.site/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# www → apex 301 (HTTPS)
server {
    server_name www.vindecoder.site;
    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/vindecoder.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vindecoder.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://vindecoder.site$request_uri;
}

# HTTP → HTTPS (and www → apex in one hop)
server {
    if ($host = www.vindecoder.site) {
        return 301 https://vindecoder.site$request_uri;
    }
    if ($host = vindecoder.site) {
        return 301 https://vindecoder.site$request_uri;
    }

    listen 80 ;
    listen [::]:80 ;
    server_name www.vindecoder.site vindecoder.site;
    return 404;
}
